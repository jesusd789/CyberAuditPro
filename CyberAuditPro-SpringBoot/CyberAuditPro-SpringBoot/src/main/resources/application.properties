spring.application.name=CyberAuditPro-API

# =========================================================
# CONEXION A MYSQL
# Cambia "cyberaudit_db" por el nombre real de tu base de
# datos (la que crea database/scrip_cyber.sql en tu repo),
# y coloca tu usuario/clave reales de MySQL.
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/cyberaudit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=19873163Avi)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# HIBERNATE / JPA
# ddl-auto=update -> Hibernate crea o actualiza la tabla
# automaticamente segun la entidad Auditoria.java
# (util para la demo; en un ambiente real se usa "validate")
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Puerto del servidor embebido (Spring Boot ya trae Tomcat, no necesitas instalarlo aparte)
server.port=8080
